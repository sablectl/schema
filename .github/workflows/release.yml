name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schema_test
          POSTGRES_PASSWORD: schema_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SCHEMA_TEST_URL: postgresql://schema_test:schema_test@127.0.0.1:5432/schema_fixture
      PGPASSWORD: schema_test

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Create reproducible tarball and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="schema-${TAG}"
          mkdir -p out
          # The lockfile ships too: Schema has a runtime dependency, so an
          # install from the tarball must resolve the same versions the
          # release was tested with.
          files="dist package.json package-lock.json"
          for f in README.md LICENSE CHANGELOG.md; do
            if [ -f "$f" ]; then
              files="$files $f"
            else
              echo "::warning::$f not found, not included in tarball"
            fi
          done
          # Fixed mtime, ownership and order, and no gzip timestamp, so the
          # same tag always produces the same bytes.
          mtime=$(git log -1 --format=%cI)
          # shellcheck disable=SC2086
          tar --sort=name --mtime="$mtime" --owner=0 --group=0 \
            --numeric-owner --transform "s,^,${name}/," \
            -cf - $files | gzip -n -9 > "out/${name}.tar.gz"
          (cd out && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "out/${name}.tar.gz.sha256"
      - name: Check the packaged artefact in a clean directory
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="schema-${TAG}"
          work=$(mktemp -d)
          tar -xzf "out/${name}.tar.gz" -C "$work"
          cd "$work/${name}"
          npm ci --omit=dev --no-audit --no-fund
          node dist/bin/schema.js --version
          node dist/bin/schema.js --help > /dev/null
          node dist/bin/schema.js connect --url "$SCHEMA_TEST_URL"
          cd - > /dev/null
          rm -rf "$work"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release notes live in the repository, so this job needs a
      # checkout of its own. Only that directory is fetched.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Verify checksum
        run: cd out && sha256sum -c ./*.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$REPO" --title "Schema $TAG" \
            --notes-file .github/release-notes/"$TAG".md --verify-tag
